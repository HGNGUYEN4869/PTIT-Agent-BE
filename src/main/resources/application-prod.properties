# Production MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://root:123456@db:27017/appAgentDB?authSource=admin&connectTimeoutMS=3000&socketTimeoutMS=3000&serverSelectionTimeoutMS=3000&maxPoolSize=50&minPoolSize=5}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:appAgentDB}

# Performance tuning
spring.main.lazy-initialization=false
spring.jmx.enabled=false
management.endpoints.enabled-by-default=false

# Logging - less verbose in production
logging.level.root=ERROR
logging.level.com.agent_chat=INFO
logging.level.org.springframework.data.mongodb.core=WARN

# Connection pool
spring.data.mongodb.auto-index-creation=false

# Server optimization
server.port=2005
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=10000
